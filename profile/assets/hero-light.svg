<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 244" width="860" height="244" role="img" aria-labelledby="title desc">
  <title id="title">NeonTechSpace — Find us on git.cafe/neontechspace</title>
  <desc id="desc">NeonTechSpace organization banner linking to https://git.cafe/neontechspace</desc>
  <defs>
    <clipPath id="clip-bc-l"><rect x="1" y="1" width="858" height="242" rx="18"/></clipPath>

    <linearGradient id="bg-bc-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="56%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <linearGradient id="border-bc-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="pulse-bc-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="78%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-bc-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.06"/>
      <stop offset="28%" stop-color="#0891b2" stop-opacity="0.38"/>
      <stop offset="56%" stop-color="#7c3aed" stop-opacity="0.36"/>
      <stop offset="84%" stop-color="#db2777" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="grid-bc-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.26"/>
    </linearGradient>

    <linearGradient id="title-bc-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="pill-bg-bc-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <linearGradient id="star-bc-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <clipPath id="sky-bc-l">
      <rect x="0" y="0" width="860" height="156"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-bc-l)">
