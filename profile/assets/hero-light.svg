    <!-- Flowing silk ribbon contours in the sky -->
    <g clip-path="url(#sky-bc-l)" fill="none" stroke="url(#wave-bc-l)" stroke-linecap="round">
      <path d="M -20 132 C 135 62, 290 164, 460 98 C 615 38, 735 96, 880 30" stroke-width="1.3" opacity="0.58"/>
      <path d="M -20 144 C 150 78, 300 174, 470 110 C 625 52, 745 108, 880 44" stroke-width="1.15" opacity="0.46"/>
      <path d="M -20 156 C 165 94, 310 184, 480 122 C 635 66, 755 120, 880 58" stroke-width="1" opacity="0.35"/>
      <path d="M -20 120 C 120 46, 280 154, 450 86 C 605 24, 725 84, 880 16" stroke-width="1" opacity="0.32"/>
      <path d="M -20 108 C 105 32, 270 144, 440 74 C 595 10, 715 72, 880 4" stroke-width="0.85" opacity="0.22"/>
    </g>

    <!-- Horizon line & perspective floor grid -->
    <line x1="0" y1="152" x2="860" y2="152" stroke="url(#pulse-bc-l)" stroke-width="1.1" opacity="0.48"/>
    <g stroke="url(#grid-bc-l)" stroke-width="0.95" fill="none">
      <line x1="0" y1="160" x2="860" y2="160" opacity="0.4"/>
      <line x1="0" y1="170" x2="860" y2="170" opacity="0.5"/>
      <line x1="0" y1="184" x2="860" y2="184" opacity="0.6"/>
      <line x1="0" y1="201" x2="860" y2="201" opacity="0.7"/>
      <line x1="0" y1="223" x2="860" y2="223" opacity="0.8"/>
      <line x1="430" y1="152" x2="430" y2="244" opacity="0.42"/>
      <line x1="402" y1="152" x2="296" y2="244" opacity="0.48"/>
      <line x1="458" y1="152" x2="564" y2="244" opacity="0.48"/>
      <line x1="372" y1="152" x2="152" y2="244" opacity="0.52"/>
      <line x1="488" y1="152" x2="708" y2="244" opacity="0.52"/>
      <line x1="336" y1="152" x2="-24" y2="244" opacity="0.52"/>
      <line x1="524" y1="152" x2="884" y2="244" opacity="0.52"/>
      <line x1="292" y1="152" x2="-160" y2="218" opacity="0.42"/>
      <line x1="568" y1="152" x2="1020" y2="218" opacity="0.42"/>
    </g>

    <line x1="210" y1="2" x2="650" y2="2" stroke="url(#pulse-bc-l)" stroke-width="2" opacity="0.7"/>
    <path d="M 232 44 L 348 44 L 360 44 L 368 31 L 377 56 L 386 37 L 394 44 L 412 44" fill="none" stroke="url(#pulse-bc-l)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 448 44 L 466 44 L 474 37 L 483 56 L 492 31 L 500 44 L 512 44 L 628 44" fill="none" stroke="url(#pulse-bc-l)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 430 30 L 433.6 40.4 L 444 44 L 433.6 47.6 L 430 58 L 426.4 47.6 L 416 44 L 426.4 40.4 Z" fill="url(#star-bc-l)"/>

    <text x="430" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="url(#title-bc-l)">NeonTechSpace</text>
    <text x="430" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.1" fill="#475569">Open-source projects and collaborative builds</text>

    <g>
      <rect x="288" y="168" width="284" height="46" rx="23" fill="url(#pill-bg-bc-l)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.25"/>
      <rect x="305" y="180" width="22" height="22" rx="6" fill="#a78bfa"/>
      <path d="M 310.8 187.2 L 318.2 187.2 L 318.2 192.2 C 318.2 194 316.8 195.2 315 195.2 L 314 195.2 C 312.2 195.2 310.8 194 310.8 192.2 Z M 318.2 188.4 L 320 188.4 C 321.1 188.4 321.8 189.1 321.8 190.2 C 321.8 191.3 321.1 192 320 192 L 318.2 192" fill="none" stroke="#1e1b4b" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="338" y="196" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="-0.15" fill="#ffffff">git.cafe/neontechspace</text>
      <path d="M 541 191 L 553 191 M 548.5 186.5 L 553.5 191 L 548.5 195.5" fill="none" stroke="#38e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
