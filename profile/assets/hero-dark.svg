<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 244" width="860" height="244" role="img" aria-labelledby="title desc">
  <title id="title">NeonTechSpace — Find us on git.cafe/neontechspace</title>
  <desc id="desc">NeonTechSpace organization banner linking to https://git.cafe/neontechspace</desc>
  <defs>
    <clipPath id="clip-bc-d"><rect x="1" y="1" width="858" height="242" rx="18"/></clipPath>

    <linearGradient id="bg-bc-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="56%" stop-color="#10112a"/>
      <stop offset="100%" stop-color="#170e2e"/>
    </linearGradient>

    <linearGradient id="border-bc-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.52"/>
    </linearGradient>

    <linearGradient id="pulse-bc-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38e8ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="78%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-bc-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.06"/>
      <stop offset="28%" stop-color="#38e8ff" stop-opacity="0.46"/>
      <stop offset="56%" stop-color="#a855f7" stop-opacity="0.44"/>
      <stop offset="84%" stop-color="#ec4899" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="grid-bc-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.08"/>
      <stop offset="38%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.36"/>
    </linearGradient>

    <linearGradient id="title-bc-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="pill-bg-bc-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.93"/>
    </linearGradient>

    <linearGradient id="pill-border-bc-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="star-bc-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="glow-bc-d1" cx="16%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-bc-d2" cx="84%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizon-bc-d" cx="50%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.32"/>
      <stop offset="58%" stop-color="#38e8ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070914" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="sky-bc-d">
      <rect x="0" y="0" width="860" height="156"/>
    </clipPath>

    <filter id="glow-bc-d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .pulse-bc-d { animation: pulseFadeBCD 4.5s ease-in-out infinite; }
    @keyframes pulseFadeBCD {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-bc-d { animation: none; }
    }
  </style>

  <g clip-path="url(#clip-bc-d)">
    <rect width="860" height="244" fill="url(#bg-bc-d)"/>
    <rect width="860" height="244" fill="url(#glow-bc-d1)"/>
    <rect width="860" height="244" fill="url(#glow-bc-d2)"/>
    <rect width="860" height="244" fill="url(#horizon-bc-d)"/>

    <!-- Flowing silk ribbon contours in the sky (from C) -->
    <g clip-path="url(#sky-bc-d)" fill="none" stroke="url(#wave-bc-d)" stroke-linecap="round">
      <path d="M -20 132 C 135 62, 290 164, 460 98 C 615 38, 735 96, 880 30" stroke-width="1.3" opacity="0.62"/>
      <path d="M -20 144 C 150 78, 300 174, 470 110 C 625 52, 745 108, 880 44" stroke-width="1.15" opacity="0.5"/>
      <path d="M -20 156 C 165 94, 310 184, 480 122 C 635 66, 755 120, 880 58" stroke-width="1" opacity="0.38"/>
      <path d="M -20 120 C 120 46, 280 154, 450 86 C 605 24, 725 84, 880 16" stroke-width="1" opacity="0.36"/>
      <path d="M -20 108 C 105 32, 270 144, 440 74 C 595 10, 715 72, 880 4" stroke-width="0.85" opacity="0.24"/>
    </g>

    <!-- Subtle sky stars -->
    <g fill="#e2e8f0">
      <circle cx="72" cy="36" r="1.2" opacity="0.48"/>
      <circle cx="164" cy="58" r="1.3" opacity="0.58" fill="#38e8ff"/>
      <circle cx="224" cy="26" r="1" opacity="0.38"/>
      <circle cx="644" cy="28" r="1.1" opacity="0.45"/>
      <circle cx="722" cy="56" r="1.4" opacity="0.58" fill="#f472b6"/>
      <circle cx="792" cy="38" r="1.2" opacity="0.48"/>
    </g>

    <!-- Horizon line & perspective floor grid (from B) -->
    <line x1="0" y1="152" x2="860" y2="152" stroke="url(#pulse-bc-d)" stroke-width="1.2" opacity="0.55"/>
    <g stroke="url(#grid-bc-d)" stroke-width="0.95" fill="none">
      <line x1="0" y1="160" x2="860" y2="160" opacity="0.35"/>
      <line x1="0" y1="170" x2="860" y2="170" opacity="0.45"/>
      <line x1="0" y1="184" x2="860" y2="184" opacity="0.56"/>
      <line x1="0" y1="201" x2="860" y2="201" opacity="0.68"/>
      <line x1="0" y1="223" x2="860" y2="223" opacity="0.8"/>
      <line x1="430" y1="152" x2="430" y2="244" opacity="0.42"/>
      <line x1="402" y1="152" x2="296" y2="244" opacity="0.48"/>
      <line x1="458" y1="152" x2="564" y2="244" opacity="0.48"/>
      <line x1="372" y1="152" x2="152" y2="244" opacity="0.52"/>
      <line x1="488" y1="152" x2="708" y2="244" opacity="0.52"/>
      <line x1="336" y1="152" x2="-24" y2="244" opacity="0.52"/>
      <line x1="524" y1="152" x2="884" y2="244" opacity="0.52"/>
      <line x1="292" y1="152" x2="-160" y2="218" opacity="0.42"/>
      <line x1="568" y1="152" x2="1020" y2="218" opacity="0.42"/>
      <line x1="230" y1="152" x2="-210" y2="188" opacity="0.32"/>
      <line x1="630" y1="152" x2="1070" y2="188" opacity="0.32"/>
    </g>

    <!-- Subtle top highlight rim -->
    <line x1="210" y1="2" x2="650" y2="2" stroke="url(#pulse-bc-d)" stroke-width="2" opacity="0.75"/>

    <!-- Signature pulse waveform + lantern star -->
    <g class="pulse-bc-d" filter="url(#glow-bc-d)">
      <path d="M 232 44 L 348 44 L 360 44 L 368 31 L 377 56 L 386 37 L 394 44 L 412 44" fill="none" stroke="url(#pulse-bc-d)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 448 44 L 466 44 L 474 37 L 483 56 L 492 31 L 500 44 L 512 44 L 628 44" fill="none" stroke="url(#pulse-bc-d)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 430 30 L 433.6 40.4 L 444 44 L 433.6 47.6 L 430 58 L 426.4 47.6 L 416 44 L 426.4 40.4 Z" fill="url(#star-bc-d)"/>
    </g>

    <!-- Wordmark & subtitle -->
    <text x="430" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="url(#title-bc-d)">NeonTechSpace</text>
    <text x="430" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.1" fill="#cbd5e1">Open-source projects and collaborative builds</text>

    <!-- Primary git.cafe CTA Pill -->
    <g>
      <rect x="288" y="168" width="284" height="46" rx="23" fill="url(#pill-bg-bc-d)" stroke="url(#pill-border-bc-d)" stroke-width="1.5"/>
      <rect x="305" y="180" width="22" height="22" rx="6" fill="#a78bfa"/>
      <path d="M 310.8 187.2 L 318.2 187.2 L 318.2 192.2 C 318.2 194 316.8 195.2 315 195.2 L 314 195.2 C 312.2 195.2 310.8 194 310.8 192.2 Z M 318.2 188.4 L 320 188.4 C 321.1 188.4 321.8 189.1 321.8 190.2 C 321.8 191.3 321.1 192 320 192 L 318.2 192" fill="none" stroke="#1e1b4b" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="338" y="196" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="-0.15" fill="#f8fafc">git.cafe/neontechspace</text>
      <path d="M 541 191 L 553 191 M 548.5 186.5 L 553.5 191 L 548.5 195.5" fill="none" stroke="#38e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="1" y="1" width="858" height="242" rx="18" fill="none" stroke="url(#border-bc-d)" stroke-width="1.25"/>
</svg>
